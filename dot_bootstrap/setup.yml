---
- name: Machine setup
  hosts: localhost
  become: true
  connection: local
  gather_facts: true

  vars:
    remote_regular_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    nerd_fonts_version: "v3.2.1"
    nerd_fonts:
      - name: JetBrainsMono
        pattern: "JetBrainsMonoNerd*FontMono*"
      - name: FiraCode
        pattern: "*FiraCode*"
    snap_packages:
      - discord
      - postman
    zsh_plugins:
      - name: zsh-autosuggestions
        repo: https://github.com/zsh-users/zsh-autosuggestions
      - name: zsh-syntax-highlighting
        repo: https://github.com/zsh-users/zsh-syntax-highlighting

  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - htop
          - vim
          - gcc
          - zsh
          - tmux
          - alacritty
          - apt-transport-https
          - ca-certificates
          - software-properties-common
          - snapd
          - unzip
        state: present
        update_cache: true

    - name: Change shell to zsh
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        shell: /usr/bin/zsh

    # Oh My Zsh Installation
    - name: Check if Oh My Zsh is already installed
      ansible.builtin.stat:
        path: "/home/{{ remote_regular_user }}/.oh-my-zsh"
      register: ohmyzsh_stat

    - name: Install Oh My Zsh
      ansible.builtin.shell: >
        curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh |
        sh -s -- --unattended --keep-zshrc --skip-chsh
      args:
        executable: /bin/bash
      become_user: "{{ remote_regular_user }}"
      when: not ohmyzsh_stat.stat.exists

    # Starship Installation
    - name: Check if starship is available in apt
      ansible.builtin.command: apt-cache show starship
      register: starship_apt
      ignore_errors: true
      changed_when: false

    - name: Install Starship via apt
      ansible.builtin.apt:
        name: starship
        state: present
      when: starship_apt is succeeded

    - name: Install Starship via curl installer (not in apt)
      ansible.builtin.shell: "curl -sS https://starship.rs/install.sh | sh -s -- --yes"
      args:
        executable: /bin/bash
        creates: /usr/local/bin/starship
      when: starship_apt is failed

    - name: Verify Starship installation
      ansible.builtin.command: starship --version
      changed_when: false

    # Brave Browser Installation
    - name: Add Brave Browser GPG key
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        mode: "0644"

    - name: Add Brave Browser repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"
        state: present
        update_cache: true

    - name: Install Brave Browser
      ansible.builtin.apt:
        name: brave-browser
        state: present

    # Snap Packages
    - name: Install Docker via geerlingguy.docker role
      block:
        - name: Include geerlingguy.docker role
          ansible.builtin.include_role:
            name: geerlingguy.docker
          vars:
            docker_users:
              - "{{ remote_regular_user }}"
      rescue:
        - name: Warn about Docker installation failure
          ansible.builtin.debug:
            msg: "Docker installation failed. Skipping and continuing with the rest of the setup."

    # Snap Packages
    - name: Install Snap packages
      ansible.builtin.command: "snap install {{ item }}"
      loop: "{{ snap_packages }}"
      register: snap_result
      changed_when: snap_result.rc == 0
      failed_when: false
      async: 120
      poll: 5

    # Font Installation
    - name: Ensure fonts directory exists
      ansible.builtin.file:
        path: "/home/{{ remote_regular_user }}/.fonts"
        state: directory
        mode: "0755"
        owner: "{{ remote_regular_user }}"

    - name: Check which Nerd Fonts are already installed
      ansible.builtin.find:
        paths: "/home/{{ remote_regular_user }}/.fonts"
        patterns: "{{ item.pattern }}"
      register: font_find_results
      loop: "{{ nerd_fonts }}"

    - name: Download missing Nerd Font zips
      ansible.builtin.get_url:
        url: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_fonts_version }}/{{ item.item.name }}.zip"
        dest: "/tmp/{{ item.item.name }}.zip"
        mode: "0644"
        timeout: 300
      loop: "{{ font_find_results.results }}"
      when: item.matched == 0

    - name: Extract missing Nerd Fonts
      ansible.builtin.unarchive:
        src: "/tmp/{{ item.item.name }}.zip"
        dest: "/home/{{ remote_regular_user }}/.fonts/"
        mode: "0755"
        owner: "{{ remote_regular_user }}"
      loop: "{{ font_find_results.results }}"
      when: item.matched == 0
      register: fonts_downloaded

    - name: Refresh font cache
      ansible.builtin.command: fc-cache -f "/home/{{ remote_regular_user }}/.fonts"
      become_user: "{{ remote_regular_user }}"
      when: fonts_downloaded.changed
      changed_when: true

    # mise Installation
    - name: Check if mise is installed
      ansible.builtin.stat:
        path: "/home/{{ remote_regular_user }}/.local/bin/mise"
      register: mise_stat

    - name: Install mise
      ansible.builtin.shell: "curl https://mise.run | sh"
      args:
        executable: /bin/bash
      become_user: "{{ remote_regular_user }}"
      when: not mise_stat.stat.exists

    # Atuin Installation
    - name: Check if atuin is installed
      ansible.builtin.stat:
        path: "/home/{{ remote_regular_user }}/.atuin/bin/atuin"
      register: atuin_stat

    - name: Install atuin
      ansible.builtin.shell: "curl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | sh -s -- --non-interactive"
      args:
        executable: /bin/bash
      become_user: "{{ remote_regular_user }}"
      when: not atuin_stat.stat.exists

    # Oh My Zsh Custom Plugins
    - name: Ensure oh-my-zsh-customization/plugins directory exists
      ansible.builtin.file:
        path: "/home/{{ remote_regular_user }}/oh-my-zsh-customization/plugins"
        state: directory
        mode: "0755"
        owner: "{{ remote_regular_user }}"
        group: "{{ remote_regular_user }}"

    - name: Clone Oh My Zsh custom plugins
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "/home/{{ remote_regular_user }}/oh-my-zsh-customization/plugins/{{ item.name }}"
        update: true
      become_user: "{{ remote_regular_user }}"
      loop: "{{ zsh_plugins }}"

    # TPM & Tmux Plugins
    - name: Clone TPM (Tmux Plugin Manager)
      ansible.builtin.git:
        repo: https://github.com/tmux-plugins/tpm
        dest: "/home/{{ remote_regular_user }}/.tmux/plugins/tpm"
        update: true
      become_user: "{{ remote_regular_user }}"

    - name: Ensure catppuccin tmux plugin directory exists
      ansible.builtin.file:
        path: "/home/{{ remote_regular_user }}/.config/tmux/plugins/catppuccin"
        state: directory
        mode: "0755"
        owner: "{{ remote_regular_user }}"
        group: "{{ remote_regular_user }}"

    - name: Install catppuccin/tmux manually (v2.3.0)
      ansible.builtin.git:
        repo: https://github.com/catppuccin/tmux
        dest: "/home/{{ remote_regular_user }}/.config/tmux/plugins/catppuccin/tmux"
        version: "v2.3.0"
        update: true
      become_user: "{{ remote_regular_user }}"

    - name: Install tmux plugins via TPM
      ansible.builtin.shell: "/home/{{ remote_regular_user }}/.tmux/plugins/tpm/bin/install_plugins"
      args:
        executable: /bin/bash
      become_user: "{{ remote_regular_user }}"
      changed_when: false
