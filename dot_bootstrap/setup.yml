---
- name: Machine setup
  hosts: localhost
  become: true
  connection: local
  gather_facts: true

  vars:
    remote_regular_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    nerd_fonts_version: "v3.2.1"
    nerd_fonts:
      - name: JetBrainsMono
        pattern: "JetBrainsMonoNerd*FontMono*"
      - name: FiraCode
        pattern: "*FiraCode*"
    snap_packages:
      - postman
    zsh_plugins:
      - name: zsh-autosuggestions
        repo: https://github.com/zsh-users/zsh-autosuggestions
      - name: zsh-syntax-highlighting
        repo: https://github.com/zsh-users/zsh-syntax-highlighting

  tasks:
    - name: Remove conflicting VS Code apt source files (if any)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/vscode.sources
        - /usr/share/keyrings/microsoft.gpg

    - name: Install packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - htop
          - vim
          - gcc
          - zsh
          - tmux
          - alacritty
          - apt-transport-https
          - ca-certificates
          - software-properties-common
          - snapd
          - unzip
        state: present
        update_cache: true

    - name: Change shell to zsh
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        shell: /usr/bin/zsh

    # Oh My Zsh Installation
    - name: Check if Oh My Zsh is already installed
      ansible.builtin.stat:
        path: "/home/{{ remote_regular_user }}/.oh-my-zsh"
      register: ohmyzsh_stat

    - name: Install Oh My Zsh
      ansible.builtin.shell: >
        curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh |
        sh -s -- --unattended --keep-zshrc --skip-chsh
      args:
        executable: /bin/bash
      become_user: "{{ remote_regular_user }}"
      when: not ohmyzsh_stat.stat.exists

    # Starship Installation
    - name: Check if starship is already installed
      ansible.builtin.command: which starship
      register: starship_installed
      changed_when: false
      failed_when: false

    - name: Install Starship
      ansible.builtin.shell: "curl -sS https://starship.rs/install.sh | sh -s -- --yes"
      args:
        executable: /bin/bash
      when: starship_installed.rc != 0

    # Brave Browser Installation
    - name: Add Brave Browser GPG key
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        mode: "0644"

    - name: Add Brave Browser repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"
        state: present
        update_cache: true

    - name: Install Brave Browser
      ansible.builtin.apt:
        name: brave-browser
        state: present

    # VS Code Installation
    - name: Install VS Code
      block:
        - name: Add Microsoft GPG key for VS Code
          ansible.builtin.shell: |
            wget -qO- https://packages.microsoft.com/keys/microsoft.asc \
              | gpg --dearmor > /etc/apt/keyrings/packages.microsoft.gpg
          args:
            executable: /bin/bash
            creates: /etc/apt/keyrings/packages.microsoft.gpg

        - name: Add VS Code apt repository
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main"
            state: present
            filename: vscode
            update_cache: true

        - name: Install VS Code
          ansible.builtin.apt:
            name: code
            state: present
      rescue:
        - name: Warn about VS Code installation failure
          ansible.builtin.debug:
            msg: "VS Code installation failed. Skipping and continuing with the rest of the setup."

    # Discord Installation
    - name: Install Discord
      block:
        - name: Download Discord .deb package
          ansible.builtin.get_url:
            url: "https://discord.com/api/download?platform=linux"
            dest: /tmp/discord.deb
            mode: "0644"
            timeout: 120

        - name: Install Discord .deb package
          ansible.builtin.apt:
            deb: /tmp/discord.deb
            state: present
      rescue:
        - name: Warn about Discord installation failure
          ansible.builtin.debug:
            msg: "Discord installation failed. Skipping and continuing with the rest of the setup."

    # JetBrains Toolbox Installation
    - name: Install JetBrains Toolbox
      block:
        - name: Check if JetBrains Toolbox is already installed
          ansible.builtin.stat:
            path: /opt/jetbrains-toolbox/bin/jetbrains-toolbox
          register: jetbrains_toolbox_stat

        - name: Ensure /opt/jetbrains-toolbox directory exists
          ansible.builtin.file:
            path: /opt/jetbrains-toolbox
            state: directory
            mode: "0755"
          when: not jetbrains_toolbox_stat.stat.exists

        - name: Download and extract JetBrains Toolbox
          ansible.builtin.shell: |
            JB_URL=$(curl -s "https://data.services.jetbrains.com/products/releases?code=TBA&latest=true&type=release" \
              | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['TBA'][0]['downloads']['linux']['link'])")
            curl -L "$JB_URL" -o /tmp/jetbrains-toolbox.tar.gz
            tar -xzf /tmp/jetbrains-toolbox.tar.gz -C /opt/jetbrains-toolbox --strip-components=1
          args:
            executable: /bin/bash
            creates: /opt/jetbrains-toolbox/bin/jetbrains-toolbox
          when: not jetbrains_toolbox_stat.stat.exists

        - name: Create symlink for JetBrains Toolbox
          ansible.builtin.file:
            src: /opt/jetbrains-toolbox/bin/jetbrains-toolbox
            dest: /usr/local/bin/jetbrains-toolbox
            state: link
      rescue:
        - name: Warn about JetBrains Toolbox installation failure
          ansible.builtin.debug:
            msg: "JetBrains Toolbox installation failed. Skipping and continuing with the rest of the setup."

    # Docker Installation
    - name: Install Docker
      block:
        - name: Include geerlingguy.docker role
          ansible.builtin.include_role:
            name: geerlingguy.docker
          vars:
            docker_users:
              - "{{ remote_regular_user }}"
      rescue:
        - name: Warn about Docker installation failure
          ansible.builtin.debug:
            msg: "Docker installation failed. Skipping and continuing with the rest of the setup."

    # Snap Packages
    - name: Install Snap packages
      ansible.builtin.command: "timeout 120 snap install {{ item }}"
      loop: "{{ snap_packages }}"
      register: snap_result
      changed_when: snap_result.rc == 0
      failed_when: false

    # Font Installation
    - name: Ensure fonts directory exists
      ansible.builtin.file:
        path: "/home/{{ remote_regular_user }}/.fonts"
        state: directory
        mode: "0755"
        owner: "{{ remote_regular_user }}"

    - name: Check which Nerd Fonts are already installed
      ansible.builtin.find:
        paths: "/home/{{ remote_regular_user }}/.fonts"
        patterns: "{{ item.pattern }}"
      register: font_find_results
      loop: "{{ nerd_fonts }}"

    - name: Download missing Nerd Font zips
      ansible.builtin.get_url:
        url: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_fonts_version }}/{{ item.item.name }}.zip"
        dest: "/tmp/{{ item.item.name }}.zip"
        mode: "0644"
        timeout: 300
      loop: "{{ font_find_results.results }}"
      when: item.matched == 0

    - name: Extract missing Nerd Fonts
      ansible.builtin.unarchive:
        src: "/tmp/{{ item.item.name }}.zip"
        dest: "/home/{{ remote_regular_user }}/.fonts/"
        mode: "0755"
        owner: "{{ remote_regular_user }}"
      loop: "{{ font_find_results.results }}"
      when: item.matched == 0
      register: fonts_downloaded

    - name: Refresh font cache
      ansible.builtin.command: fc-cache -f "/home/{{ remote_regular_user }}/.fonts"
      become_user: "{{ remote_regular_user }}"
      when: fonts_downloaded.changed
      changed_when: true

    # mise Installation
    - name: Check if mise is installed
      ansible.builtin.stat:
        path: "/home/{{ remote_regular_user }}/.local/bin/mise"
      register: mise_stat

    - name: Install mise
      ansible.builtin.shell: "curl https://mise.run | sh"
      args:
        executable: /bin/bash
      become_user: "{{ remote_regular_user }}"
      when: not mise_stat.stat.exists

    # Atuin Installation
    - name: Check if atuin is installed
      ansible.builtin.stat:
        path: "/home/{{ remote_regular_user }}/.atuin/bin/atuin"
      register: atuin_stat

    - name: Install atuin
      ansible.builtin.shell: "curl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | sh -s -- --non-interactive"
      args:
        executable: /bin/bash
      become_user: "{{ remote_regular_user }}"
      when: not atuin_stat.stat.exists

    # Eza Installation
    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add eza GPG key
      ansible.builtin.shell: |
        wget -qO- https://raw.githubusercontent.com/eza-community/eza/main/deb.asc | gpg --dearmor -o /etc/apt/keyrings/gierens.gpg
      args:
        executable: /bin/bash
        creates: /etc/apt/keyrings/gierens.gpg

    - name: Set permissions on eza GPG key and apt list
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0644"
      loop:
        - /etc/apt/keyrings/gierens.gpg
      failed_when: false

    - name: Add eza apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/gierens.gpg] http://deb.gierens.de stable main"
        state: present
        filename: gierens
        update_cache: true

    - name: Set permissions on eza apt list
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/gierens.list
        mode: "0644"
      failed_when: false

    - name: Install eza
      ansible.builtin.apt:
        name: eza
        state: present

    - name: Ensure eza completions directory exists
      ansible.builtin.file:
        path: "/home/{{ remote_regular_user }}/.local/share/eza"
        state: directory
        mode: "0755"
        owner: "{{ remote_regular_user }}"
        group: "{{ remote_regular_user }}"

    - name: Clone eza repository for zsh completions
      ansible.builtin.git:
        repo: https://github.com/eza-community/eza.git
        dest: "/home/{{ remote_regular_user }}/.local/share/eza"
        update: true
      become_user: "{{ remote_regular_user }}"

    # fzf Installation
    - name: Ensure ~/.local/bin directory exists for fzf
      ansible.builtin.file:
        path: "/home/{{ remote_regular_user }}/.local/bin"
        state: directory
        mode: "0755"
        owner: "{{ remote_regular_user }}"
        group: "{{ remote_regular_user }}"

    - name: Check if fzf is installed
      ansible.builtin.stat:
        path: "/home/{{ remote_regular_user }}/.local/bin/fzf"
      register: fzf_stat

    - name: Install fzf latest binary
      ansible.builtin.shell: |
        ARCH=$(uname -m)
        case $ARCH in
          x86_64) ARCH="amd64" ;;
          aarch64) ARCH="arm64" ;;
          armv7*) ARCH="armv7" ;;
        esac
        FZF_VERSION=$(curl -fsSL https://api.github.com/repos/junegunn/fzf/releases/latest \
          | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
        curl -fsSL "https://github.com/junegunn/fzf/releases/download/v${FZF_VERSION}/fzf-${FZF_VERSION}-linux_${ARCH}.tar.gz" \
          | tar -xz -C "$HOME/.local/bin" fzf
      args:
        executable: /bin/bash
      become_user: "{{ remote_regular_user }}"
      when: not fzf_stat.stat.exists

    # Zoxide Installation
    - name: Check if zoxide is installed
      ansible.builtin.stat:
        path: "/home/{{ remote_regular_user }}/.local/bin/zoxide"
      register: zoxide_stat

    - name: Install zoxide
      ansible.builtin.shell: "curl -sSfL https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | sh"
      args:
        executable: /bin/bash
      become_user: "{{ remote_regular_user }}"
      when: not zoxide_stat.stat.exists

    # Claude CLI Installation
    - name: Check if Claude CLI is installed
      ansible.builtin.stat:
        path: "/home/{{ remote_regular_user }}/.claude/local/claude"
      register: claude_stat

    - name: Install Claude CLI
      ansible.builtin.shell: "curl -fsSL https://claude.ai/install.sh | bash"
      args:
        executable: /bin/bash
      become_user: "{{ remote_regular_user }}"
      when: not claude_stat.stat.exists

    # Oh My Zsh Custom Plugins
    - name: Ensure oh-my-zsh-customization/plugins directory exists
      ansible.builtin.file:
        path: "/home/{{ remote_regular_user }}/oh-my-zsh-customization/plugins"
        state: directory
        mode: "0755"
        owner: "{{ remote_regular_user }}"
        group: "{{ remote_regular_user }}"

    - name: Clone Oh My Zsh custom plugins
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "/home/{{ remote_regular_user }}/oh-my-zsh-customization/plugins/{{ item.name }}"
        update: true
      become_user: "{{ remote_regular_user }}"
      loop: "{{ zsh_plugins }}"

    # TPM & Tmux Plugins
    - name: Clone TPM (Tmux Plugin Manager)
      ansible.builtin.git:
        repo: https://github.com/tmux-plugins/tpm
        dest: "/home/{{ remote_regular_user }}/.tmux/plugins/tpm"
        update: true
      become_user: "{{ remote_regular_user }}"

    - name: Ensure catppuccin tmux plugin directory exists
      ansible.builtin.file:
        path: "/home/{{ remote_regular_user }}/.config/tmux/plugins/catppuccin"
        state: directory
        mode: "0755"
        owner: "{{ remote_regular_user }}"
        group: "{{ remote_regular_user }}"

    - name: Install catppuccin/tmux manually (v2.3.0)
      ansible.builtin.git:
        repo: https://github.com/catppuccin/tmux
        dest: "/home/{{ remote_regular_user }}/.config/tmux/plugins/catppuccin/tmux"
        version: "v2.3.0"
        update: true
      become_user: "{{ remote_regular_user }}"

    - name: Install tmux plugins via TPM
      ansible.builtin.shell: "/home/{{ remote_regular_user }}/.tmux/plugins/tpm/bin/install_plugins"
      args:
        executable: /bin/bash
      become_user: "{{ remote_regular_user }}"
      changed_when: false
