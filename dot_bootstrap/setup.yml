---
- name: Machine setup
  hosts: localhost
  become: true
  connection: local
  gather_facts: true

  vars:
    nerd_fonts_version: "v3.2.1"
    nerd_fonts:
      - name: JetBrainsMono
        pattern: "JetBrainsMonoNerd*FontMono*"
      - name: FiraCode
        pattern: "*FiraCode*"
    snap_packages:
      - discord
      - postman
      - dbeaver-ce

  tasks:
    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_env.SUDO_USER or ansible_user_id }}"

    - name: Install packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - htop
          - vim
          - gcc
          - zsh
          - tmux
          - alacritty
          - apt-transport-https
          - ca-certificates
          - software-properties-common
          - snapd
        state: present
        update_cache: true

    - name: Change shell to zsh
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        shell: /usr/bin/zsh

    # Starship Installation
    - name: Check if Starship is installed
      ansible.builtin.command: "command -v starship"
      register: starship_installed
      ignore_errors: true
      changed_when: false

    - name: Download Starship installer script
      ansible.builtin.get_url:
        url: https://starship.rs/install.sh
        dest: /tmp/starship_install.sh
        mode: "0755"
      when: starship_installed is failed

    - name: Install Starship prompt
      ansible.builtin.shell: "set -o pipefail && sh /tmp/starship_install.sh -y"
      args:
        executable: /bin/bash
        creates: /usr/local/bin/starship
      when: starship_installed is failed

    - name: Verify Starship installation
      ansible.builtin.command: starship --version
      changed_when: false

    # Brave Browser Installation
    - name: Add Brave Browser GPG key
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        mode: "0644"

    - name: Add Brave Browser repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"
        state: present
        update_cache: true

    - name: Install Brave Browser
      ansible.builtin.apt:
        name: brave-browser
        state: present

    # Docker Installation
    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present
        update_cache: true

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        groups: docker
        append: true

    # Snap Packages
    - name: Install Snap packages
      community.general.snap:
        name: "{{ item }}"
        state: present
      loop: "{{ snap_packages }}"

    # Font Installation
    - name: Ensure fonts directory exists
      ansible.builtin.file:
        path: "/home/{{ remote_regular_user }}/.fonts"
        state: directory
        mode: "0755"
        owner: "{{ remote_regular_user }}"

    - name: Check which Nerd Fonts are already installed
      ansible.builtin.find:
        paths: "/home/{{ remote_regular_user }}/.fonts"
        patterns: "{{ item.pattern }}"
      register: font_find_results
      loop: "{{ nerd_fonts }}"

    - name: Download missing Nerd Fonts
      ansible.builtin.unarchive:
        src: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_fonts_version }}/{{ item.item.name }}.zip"
        dest: "/home/{{ remote_regular_user }}/.fonts/"
        remote_src: true
        mode: "0755"
        owner: "{{ remote_regular_user }}"
      loop: "{{ font_find_results.results }}"
      when: item.matched == 0

    # mise Installation
    - name: Check if mise is installed
      ansible.builtin.stat:
        path: "/home/{{ remote_regular_user }}/.local/bin/mise"
      register: mise_stat

    - name: Install mise
      ansible.builtin.shell: "curl https://mise.run | sh"
      args:
        executable: /bin/bash
      become_user: "{{ remote_regular_user }}"
      when: not mise_stat.stat.exists

    # Atuin Installation
    - name: Check if atuin is installed
      ansible.builtin.stat:
        path: "/home/{{ remote_regular_user }}/.atuin/bin/atuin"
      register: atuin_stat

    - name: Install atuin
      ansible.builtin.shell: "curl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | sh -s -- --non-interactive"
      args:
        executable: /bin/bash
      become_user: "{{ remote_regular_user }}"
      when: not atuin_stat.stat.exists
